name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run node tests
        run: node --test --test-concurrency=1 $(find . -type f -name '*.test.mjs' -not -path './.git/*')
      - name: Run verify-env tests on a simulated win32 host
        working-directory: skills/verify-env
        run: node --import ./test/win32-host.mjs --test test/*.test.mjs
